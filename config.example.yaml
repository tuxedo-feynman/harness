# Copy to config.yaml to get started. config.yaml is gitignored.

# Actions to register at startup. Each entry gets its own config block.
# The null action is always present and needs no entry.
actions:
  terminal:
  fake:                 # canned thinking action, no network
  # openai:             # OpenAI-compatible API (llama-server or the real thing)
  #   model: local
  #   base_url: http://localhost:8080/v1
  # claude:             # Anthropic Claude
  #   api_key: "sk-ant-..."   # optional: omit to resolve from ANTHROPIC_API_KEY
  #   model: claude-opus-5
  #   max_tokens: 16000
  # telegram:           # Telegram bot channel (listens alongside terminal in --chat)
  #   token: "123456:your-bot-token"   # optional: omit to resolve from TELEGRAM_BOT_TOKEN
  #   chat_ids:            # allow-list: numeric chat ids or "@username" entries.
  #     - "@your-username" #   usernames match incoming messages; only numeric ids
  #     - 123456789        #   can be send targets. Empty/omitted = accept all.

# Which thinking action the policy controller routes to.
default_thinking_action: fake

system_prompt: |
  You are Malkmus, a local development assistant.
  Be concise.
  Use actions only when necessary.

logging:
  env: dev              # dev logs to /tmp/hyh.log unless log_file is set
  # log_file: /path/to/hyh.log      # required when env: production
