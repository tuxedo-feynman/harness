# Copy to config.yaml to get started. config.yaml is gitignored.

thinking_action:
  type: fake            # "fake" (no network) or "openai" (OpenAI-compatible API)
  # model: local
  # base_url: http://localhost:8080/v1   # llama-server, or https://api.openai.com/v1

system_prompt: |
  You are a local development assistant.
  Be concise.
  Use actions only when necessary.

logging:
  env: dev              # dev logs to /tmp/harness.log unless log_file is set
  # log_file: /path/to/harness.log      # required when env: production
